services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3.8-nvfp4-vllm-local:latest
    container_name: qwen3.8-nvfp4-vllm
    restart: unless-stopped
    user: "${VLLM_UID:?Run ./scripts/compose.sh so the host UID is detected}:0"
    runtime: nvidia
    shm_size: ${VLLM_SHM_SIZE:-8gb}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VLLM_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    environment:
      # The numeric host UID may not have an /etc/passwd entry in the image.
      # PyTorch's cache initialization uses these before falling back to getpwuid().
      USER: vllm
      LOGNAME: vllm
      MODEL_PRESET: ${MODEL_PRESET:-Qwen3.8-27B}
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-}
    volumes:
      - ${HF_CACHE_PATH:?Run ./scripts/compose.sh so the host cache is detected}:/home/vllm/.cache/huggingface:ro
      # This checksum-safe guard against the truncation setting found in older
      # checkpoint revisions is generated by compose.sh with truncation=null.
      - ${VLLM_TOKENIZER_FIX_PATH:?Run ./scripts/compose.sh to prepare the tokenizer fix}:${VLLM_TOKENIZER_TARGET:?Run ./scripts/compose.sh to locate the tokenizer}:ro
      - vllm-runtime-cache:/home/vllm/.cache/vllm
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=4g,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-terminal:
    build:
      context: .
      dockerfile: Dockerfile.open-terminal
    image: qwen3.8-open-terminal-local:0.11.34
    container_name: qwen3.8-open-terminal
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?Set OPEN_TERMINAL_API_KEY in .env}
      OPEN_TERMINAL_ENABLE_TERMINAL: "true"
      OPEN_TERMINAL_ENABLE_NOTEBOOKS: "true"
      OPEN_TERMINAL_FILE_BROWSER_ROOT: home
      OPEN_TERMINAL_MAX_SESSIONS: ${OPEN_TERMINAL_MAX_SESSIONS:-8}
      OPEN_TERMINAL_INFO: >-
        Isolated demonstration workspace. Files persist in /home/user, but the
        host filesystem and Docker socket are not mounted.
    volumes:
      - open-terminal-home:/home/user
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    image: qwen3.8-open-webui-local:v0.11.1
    container_name: qwen3.8-open-webui
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    depends_on:
      vllm:
        condition: service_healthy
      open-terminal:
        condition: service_healthy
    environment:
      WEBUI_AUTH: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: pending
      # Keep operator-supplied provider credentials authoritative on restart.
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://vllm:8000/v1
      OPENAI_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}
      DEFAULT_MODELS: ${MODEL_PRESET:-Qwen3.8-27B}
      DEFAULT_PINNED_MODELS: ${MODEL_PRESET:-Qwen3.8-27B}
      TASK_MODEL_EXTERNAL: ${MODEL_PRESET:-Qwen3.8-27B}
      CUDA_VISIBLE_DEVICES: ""
      RAG_EMBEDDING_ENGINE: ""
      RAG_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: tavily
      TAVILY_API_KEY: ${TAVILY_API_KEY:?Set TAVILY_API_KEY in .env}
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id":"qwen-sandbox","url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY:?Set OPEN_TERMINAL_API_KEY in .env}","name":"Qwen Sandbox","auth_type":"bearer","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]}}]
    volumes:
      - open-webui-data:/app/backend/data
      - open-webui-static:/app/backend/open_webui/static
      - ${EMBEDDING_CACHE_PATH:?Run ./scripts/compose.sh so the host embedding cache is detected}:/app/backend/data/cache/embedding/models:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  vllm-runtime-cache:
  open-webui-data:
  open-webui-static:
  open-terminal-home:
